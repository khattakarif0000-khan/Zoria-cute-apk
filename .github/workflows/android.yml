name: Build ZORIA Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses and Install SDK 36
      run: |
        export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
        mkdir -p "$ANDROID_HOME/licenses"
        # Accept all Android SDK licenses non-interactively
        yes | sdkmanager --licenses || true
        # Install specifically required platform for compileSdk 36 without unnecessary extras
        sdkmanager --install "platforms;android-36" "platform-tools"
        # Confirm all updated licenses
        yes | sdkmanager --licenses || true

    - name: Prepare environment configuration
      run: |
        if [ ! -f .env ]; then
          cp .env.example .env
        fi

    - name: Ensure Gradle wrapper is ready
      run: |
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          gradle wrapper || true
        fi
        chmod +x gradlew

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload ZORIA APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZORIA-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
